name: Collect threat feeds
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    paths:
      - 'scripts/collect-threats.py'
      - '.github/workflows/threat-feed.yml'
permissions:
  contents: write
concurrency:
  group: threat-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        id: collect
        continue-on-error: true
        run: python scripts/collect-threats.py
      - name: Save snapshot
        run: |
          test -s public/threat-feed.json
          python -m json.tool public/threat-feed.json > /dev/null
          git add public/threat-feed.json
          if ! git diff --cached --quiet; then
            git config user.name 'cyber-world-feed[bot]'
            git config user.email 'cyber-world-feed[bot]@users.noreply.github.com'
            git commit -m 'Update threat intelligence feed'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report partial failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
